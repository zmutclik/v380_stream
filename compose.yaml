services:
  v380-rtsp:
    image: v380-rtsp
    build: .
    container_name: v380-rtsp
    restart: unless-stopped
    # ponytail: host mode langsung bind port LAN. Ganti ports jika di macOS/Windows Docker Desktop.
    network_mode: host
    env_file: .env
    volumes:
      - ./v380_stream.py:/app/v380_stream.py:ro
      - ./mediamtx.yml:/app/mediamtx.yml:ro
